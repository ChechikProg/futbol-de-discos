<title>Fútbol de Discos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Concepto: una sola escena (la cancha) y menús tipo vestuario oscuro con acentos de césped.
   Ambientación oscura fija a propósito: el juego es una escena nocturna de cancha. */
:root {
  --bg: #111815;
  --panel: #18211d;
  --panel-2: #202c27;
  --panel-3: #283731;
  --line: #2f3f38;
  --fg: #e9f0ea;
  --mute: #93a89b;
  --lime: #c7e6bd;
  --lime-ink: #10200f;
  --red: #e56e56;
  --blue: #5689e5;
  --gold: #e8c14a;
  --bad: #ff9a86;
  --ok: #8fd69b;
  --f-display: "Chakra Petch", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.4 var(--f-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
input[type="text"] { -webkit-user-select: text; user-select: text; }

/* ---------- Pantallas y tarjetas ---------- */
.screen {
  position: fixed; inset: 0; z-index: 5; display: flex; overflow-y: auto; background: var(--bg);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.screen.overlay { background: rgba(8, 12, 10, .74); }
.card {
  width: 100%; max-width: 560px; box-sizing: border-box; margin: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0;
}
.card.wide { max-width: 980px; }
.card.home { max-width: 780px; }
.card.small { max-width: 380px; text-align: center; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 32px; line-height: 1.05; font-weight: 700; }
h2 { font-size: 30px; font-weight: 700; }
h3 { font-size: 26px; font-weight: 700; }
h4 { font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.sub { margin: 0; color: var(--mute); font-size: 15px; }
.fine { margin: 0; color: var(--mute); font-size: 13px; }
.meta { margin: 0; color: var(--mute); font-size: 15px; }
.eyebrow { margin: 0; font: 600 12px var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--mute); }

.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back {
  appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  font: 600 14px var(--f-body); padding: 8px 12px; border-radius: 8px; cursor: pointer;
}
.back:hover { border-color: #46604f; }

.brand { display: flex; align-items: center; gap: 14px; }
.logo svg { width: 56px; height: 56px; display: block; }

/* ---------- Controles ---------- */
.groups { display: grid; grid-template-columns: 1fr; gap: 16px; }
fieldset.grp { border: 0; margin: 0; padding: 0; min-width: 0; }
fieldset.grp legend { padding: 0; margin-bottom: 6px; font: 600 12px var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--mute); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  flex: 1 1 0; min-width: 72px; text-align: center; cursor: pointer;
  padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--fg); font: 600 15px var(--f-display);
}
.seg label:hover { border-color: #46604f; }
.seg input:checked + label { background: rgba(199, 230, 189, .14); border-color: var(--lime); color: var(--lime); }
.seg input:checked + label[data-tone="red"] { background: var(--red); border-color: var(--red); color: #26100b; }
.seg input:checked + label[data-tone="blue"] { background: var(--blue); border-color: var(--blue); color: #0b1a33; }
.seg input:focus-visible + label { outline: 2px solid #fff; outline-offset: 2px; }
fieldset:disabled .seg label { opacity: .5; cursor: default; }
.hint { margin: 8px 0 0; font-size: 14px; color: var(--mute); min-height: 2.8em; }

.pitch-row { display: flex; gap: 14px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.pitch-row .hint { margin: 0; min-height: 0; flex: 1 1 160px; }
.pitch-prev svg { display: block; max-width: 100%; height: auto; }
.pv-field { fill: #55704a; stroke: #c7e6bd; stroke-width: 1.2; }
.pv-line { stroke: #c7e6bd; stroke-width: 1; fill: none; }
.pv-goal { stroke: none; }
.pv-red { fill: var(--red); } .pv-blue { fill: var(--blue); }
.sliders { display: grid; gap: 8px; margin-top: 10px; }
.slider { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; font-size: 14px; color: var(--mute); }
.slider output { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
.slider input { width: 100%; min-width: 0; accent-color: var(--lime); }

.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  font: 700 17px var(--f-display); padding: 13px 18px; border-radius: 10px; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: #46604f; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .back:focus-visible, .mode:focus-visible, .chip:focus-visible, .team:focus-visible, .tab:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.btn.go { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); font-size: 19px; padding: 14px 18px; }
.btn.go:hover:not(:disabled) { background: #d6efcd; }
.btn.sm { font-size: 14px; padding: 8px 12px; border-radius: 8px; }
.btn.go.sm { font-size: 15px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 auto; }

/* ---------- Inicio ---------- */
.modes { display: grid; grid-template-columns: 1fr; gap: 12px; }
.mode {
  appearance: none; text-align: left; cursor: pointer; color: var(--fg);
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  display: grid; gap: 6px; grid-template-columns: 64px 1fr; grid-template-areas: "i t" "i d"; align-items: center; column-gap: 14px;
}
.mode:hover { border-color: var(--lime); background: var(--panel-3); }
.mode-i { grid-area: i; } .mode-i svg { width: 64px; height: 40px; display: block; }
.mode-t { grid-area: t; font: 700 20px var(--f-display); }
.mode-d { grid-area: d; color: var(--mute); font-size: 14px; }
details.keys { border-top: 1px solid var(--line); padding-top: 14px; color: var(--mute); font-size: 14px; }
details.keys summary { cursor: pointer; font: 600 13px var(--f-body); letter-spacing: .08em; text-transform: uppercase; }
details.keys div { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
details.keys b { color: var(--fg); font-weight: 600; min-width: 62px; display: inline-block; }
kbd { font: 600 12px var(--f-display); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 7px; }
.soundbtn { align-self: flex-start; }

/* ---------- Mundial ---------- */
.kit { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #101412; flex: none; box-sizing: border-box; vertical-align: middle; }
.kit.big { width: 34px; height: 34px; border-width: 3px; }
.resume { display: flex; gap: 12px; align-items: center; background: var(--panel-2); border: 1px solid var(--lime); border-radius: 10px; padding: 12px; flex-wrap: wrap; }
.resume-t { display: grid; flex: 1 1 160px; min-width: 0; } .resume-t span { color: var(--mute); font-size: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font: 600 13px var(--f-body); padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.chip.on { background: rgba(199, 230, 189, .16); border-color: var(--lime); color: var(--lime); }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 8px; }
.team {
  appearance: none; text-align: left; cursor: pointer; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; grid-template-areas: "k c" "n n" "s s";
}
.team .kit { grid-area: k; width: 22px; height: 22px; } .team .tc { grid-area: c; font: 700 17px var(--f-display); }
.team .tn { grid-area: n; font-size: 14px; } .team .ts { grid-area: s; color: var(--gold); font-size: 13px; letter-spacing: .1em; }
.team:hover { border-color: #46604f; } .team.on { border-color: var(--lime); background: rgba(199, 230, 189, .12); }
.teamfoot { position: sticky; bottom: -24px; margin: 0 -24px -24px; padding: 14px 24px; background: var(--panel); border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.teamfoot-t { display: grid; flex: 1 1 140px; min-width: 0; } .teamfoot-t span { color: var(--mute); font-size: 13px; }
.teamfoot .btn { flex: 0 0 auto; }

.hubhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ht { display: grid; flex: 1 1 200px; min-width: 0; } .ht b { font: 700 22px var(--f-display); } .ht span { color: var(--mute); font-size: 14px; }
.hbtn { display: flex; gap: 8px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--mute); font: 700 16px var(--f-display); padding: 10px 16px; cursor: pointer; margin-bottom: -1px; }
.tab.on { color: var(--lime); border-bottom-color: var(--lime); }
.hubbody { display: grid; gap: 16px; min-width: 0; }
.next { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
.next.gold { border-color: var(--gold); } .next.gold h3 { color: var(--gold); } .next.out { border-color: var(--bad); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.side { display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; } .side b { font: 700 20px var(--f-display); overflow-wrap: anywhere; } .side span { color: var(--gold); font-size: 13px; letter-spacing: .1em; }
.vsx { font: 700 18px var(--f-display); color: var(--mute); }
.panel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.res { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; font-size: 14px; padding: 5px 6px; border-radius: 6px; }
.res.me { background: rgba(199, 230, 189, .13); font-weight: 600; }
.res .ra { display: flex; gap: 6px; align-items: center; justify-content: flex-end; text-align: right; min-width: 0; }
.res .rb { display: flex; gap: 6px; align-items: center; min-width: 0; }
.res .rs { font: 700 15px var(--f-display); text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.res .rt { grid-column: 1 / -1; text-align: center; color: var(--mute); font-size: 12px; font-style: normal; }
.podium { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.podium li { display: flex; gap: 10px; align-items: center; } .podium li > span:last-child { color: var(--mute); margin-left: auto; font-size: 14px; }
.gtabs { display: grid; grid-template-columns: 1fr; gap: 12px; }
.gt.mine { border-color: var(--lime); }
.tablewrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: right; color: var(--mute); font: 600 12px var(--f-body); padding: 4px 6px; } .tbl th:nth-child(2) { text-align: left; }
.tbl td { padding: 6px; text-align: right; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
.tbl td.pos { text-align: left; width: 22px; color: var(--mute); } .tbl td.tm { text-align: left; } .tbl td.tm span { margin-left: 8px; } .tbl td.pts { font-weight: 700; }
.tbl tr.q td.pos { color: var(--ok); box-shadow: inset 3px 0 var(--ok); } .tbl tr.q3 td.pos { box-shadow: inset 3px 0 var(--gold); }
.tbl tr.me td { background: rgba(199, 230, 189, .13); font-weight: 600; }
.mini { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--mute); font-size: 13px; } .mini .me { color: var(--lime); }
.bracketwrap { overflow-x: auto; padding-bottom: 8px; }
.bracket { display: flex; gap: 14px; min-width: max-content; align-items: stretch; }
.bcol { display: flex; flex-direction: column; gap: 10px; width: 168px; }
.bcm { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 8px; }
.bcol.now h4 { color: var(--lime); }
.bm { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: grid; gap: 2px; font-size: 14px; }
.bm.mine { border-color: var(--lime); } .bm.empty { color: var(--mute); }
.bm em { font-size: 11px; color: var(--mute); font-style: normal; letter-spacing: .06em; text-transform: uppercase; } .bm small { color: var(--mute); font-size: 11px; }
.bt { display: flex; gap: 8px; align-items: center; } .bt.w { font-weight: 700; } .bt.me .bn { color: var(--lime); } .bt .bg { margin-left: auto; font: 700 15px var(--f-display); font-variant-numeric: tabular-nums; }

/* ---------- Penales ---------- */
.card.pk { max-width: 620px; text-align: center; }
.pk-head { display: grid; gap: 8px; }
.pk-team { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; text-align: left; }
.pk-kit { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #101412; box-sizing: border-box; }
.pk-team b { font: 600 15px var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-team em { font: 700 24px var(--f-display); font-style: normal; min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
.pk-dots { display: inline-flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.pk-dots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--mute); box-sizing: border-box; }
.pk-dots i.ok { background: var(--ok); border-color: var(--ok); } .pk-dots i.no { background: var(--bad); border-color: var(--bad); }
.pk-info { margin: 0; min-height: 2.6em; font: 600 17px/1.3 var(--f-body); }
.pk-info.final { font: 700 24px/1.2 var(--f-display); color: var(--lime); }
.pk-hint { margin: 0; min-height: 1.3em; font-size: 14px; color: var(--mute); }
.pk-goal { position: relative; width: 100%; aspect-ratio: 5 / 2; box-sizing: border-box; margin: 14px 0 66px; border: 6px solid var(--fg); border-bottom: 0; border-radius: 4px 4px 0 0;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 2px, transparent 2px 12px), repeating-linear-gradient(-45deg, rgba(255,255,255,.07) 0 2px, transparent 2px 12px), #1d2a24; }
.pk-goal::after { content: ""; position: absolute; left: -14%; right: -14%; bottom: 0; height: 3px; background: var(--line); }
.pk-keeper { position: absolute; bottom: 5%; left: 50%; width: 12%; aspect-ratio: 1; border-radius: 50%; border: 3px solid #101412; box-sizing: border-box; transform: translate(-50%, 0); transition: left .35s ease-out, transform .35s ease-out; }
.pk-ball { position: absolute; width: 6.4%; aspect-ratio: 1; border-radius: 50%; background: #fff; border: 3px solid #101412; box-sizing: border-box; left: 50%; top: 138%; transform: translate(-50%, -50%);
  transition: left .55s cubic-bezier(.2,.7,.3,1), top .55s cubic-bezier(.2,.7,.3,1), transform .55s; }
.pk-cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; }
.pk-cell { background: transparent; border: 1px dashed rgba(255,255,255,.18); cursor: pointer; padding: 0; color: inherit; }
.pk-cell:hover, .pk-cell:focus-visible { background: rgba(199,230,189,.22); outline: none; }
.pk-flash { position: absolute; inset: 0; display: grid; place-items: center; font: 700 clamp(26px, 8vw, 44px) var(--f-display); opacity: 0; pointer-events: none; text-shadow: 0 2px 0 #101412, 0 0 12px rgba(8,12,10,.9); }
.pk-flash.on { opacity: 1; } .pk-flash.good { color: var(--lime); } .pk-flash.bad { color: var(--bad); }
.pk-foot { display: flex; justify-content: center; }
.pk-foot .btn { min-width: 200px; }

/* ---------- Fin de partido / pausa ---------- */
#endTitle[data-res="win"] { color: var(--lime); } #endTitle[data-res="lose"] { color: var(--red); }
#endScore { font: 700 56px/1 var(--f-display); display: flex; justify-content: center; gap: 16px; align-items: center; font-variant-numeric: tabular-nums; }
#endScore i { color: var(--mute); font-style: normal; }
.endnames { margin: 0; display: flex; justify-content: space-between; gap: 12px; color: var(--mute); font-size: 14px; }
#endMeta { margin: 0; color: var(--mute); font-size: 15px; }

#pauseBtn {
  position: fixed; z-index: 4; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: rgba(8, 12, 10, .72); display: flex; gap: 5px; align-items: center; justify-content: center; cursor: pointer; padding: 0;
}
#pauseBtn span { width: 4px; height: 16px; background: var(--fg); border-radius: 2px; }
#pauseBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

#touch { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
#stickBase { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .06); display: none; }
#stickBase.on { display: block; }
#stickKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, .4); transform: translate(-50%, -50%); }
#kickBtn {
  position: fixed; pointer-events: auto; touch-action: none;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 8px); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 14px);
  width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .55);
  background: rgba(255, 255, 255, .12); color: #fff; font: 700 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase;
}
#kickBtn.on { background: rgba(255, 255, 255, .5); border-color: #fff; color: #111; }

@media (min-width: 700px) {
  .groups { grid-template-columns: 1fr 1fr; }
  .groups .g-size, .groups .g-diff, .groups .g-format, .groups .g-pitch { grid-column: 1 / -1; }
  .modes { grid-template-columns: repeat(3, 1fr); }
  .mode { grid-template-columns: 1fr; grid-template-areas: "i" "t" "d"; align-content: start; row-gap: 8px; }
  .mode-i svg { width: 76px; height: 48px; }
  .teamcols { grid-template-columns: repeat(3, 1fr); }
  .gtabs { grid-template-columns: 1fr 1fr; }
}
@media (max-height: 520px) {
  .card { padding: 16px; gap: 12px; }
  h1 { font-size: 26px; }
  details.keys { display: none; }
}
@media (max-width: 480px) {
  .card { padding: 18px; }
  .slider { grid-template-columns: 92px 1fr 40px; }
  .teamfoot { margin: 0 -18px -18px; padding: 12px 18px; bottom: -18px; }
}
</style>
<!--BODY-->
<canvas id="cv"></canvas>
<button id="pauseBtn" type="button" aria-label="Menú" hidden><span></span><span></span></button>
<div id="touch" hidden>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <button id="kickBtn" type="button">Patear</button>
</div>
<script>
/*__JS__*/
</script>
