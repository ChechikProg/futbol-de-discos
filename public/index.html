<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fútbol de Discos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Concepto: una sola escena (la cancha) y menús tipo vestuario oscuro con acentos de césped.
   Ambientación oscura fija a propósito: el juego es una escena nocturna de cancha. */
:root {
  --bg: #111815;
  --panel: #18211d;
  --panel-2: #202c27;
  --panel-3: #283731;
  --line: #2f3f38;
  --fg: #e9f0ea;
  --mute: #93a89b;
  --lime: #c7e6bd;
  --lime-ink: #10200f;
  --red: #e56e56;
  --blue: #5689e5;
  --gold: #e8c14a;
  --bad: #ff9a86;
  --ok: #8fd69b;
  --f-display: "Chakra Petch", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.4 var(--f-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
input[type="text"] { -webkit-user-select: text; user-select: text; }

/* ---------- Pantallas y tarjetas ---------- */
.screen {
  position: fixed; inset: 0; z-index: 5; display: flex; overflow-y: auto; background: var(--bg);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.screen.overlay { background: rgba(8, 12, 10, .74); }
.card {
  width: 100%; max-width: 560px; box-sizing: border-box; margin: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0;
}
.card.wide { max-width: 980px; }
.card.home { max-width: 780px; }
.card.small { max-width: 380px; text-align: center; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 32px; line-height: 1.05; font-weight: 700; }
h2 { font-size: 30px; font-weight: 700; }
h3 { font-size: 26px; font-weight: 700; }
h4 { font-size: 15px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.sub { margin: 0; color: var(--mute); font-size: 15px; }
.fine { margin: 0; color: var(--mute); font-size: 13px; }
.meta { margin: 0; color: var(--mute); font-size: 15px; }
.eyebrow { margin: 0; font: 600 12px var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--mute); }

.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back {
  appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  font: 600 14px var(--f-body); padding: 8px 12px; border-radius: 8px; cursor: pointer;
}
.back:hover { border-color: #46604f; }

.brand { display: flex; align-items: center; gap: 14px; }
.logo svg { width: 56px; height: 56px; display: block; }

/* ---------- Controles ---------- */
.groups { display: grid; grid-template-columns: 1fr; gap: 16px; }
fieldset.grp { border: 0; margin: 0; padding: 0; min-width: 0; }
fieldset.grp legend { padding: 0; margin-bottom: 6px; font: 600 12px var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--mute); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  flex: 1 1 0; min-width: 72px; text-align: center; cursor: pointer;
  padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--fg); font: 600 15px var(--f-display);
}
.seg label:hover { border-color: #46604f; }
.seg input:checked + label { background: rgba(199, 230, 189, .14); border-color: var(--lime); color: var(--lime); }
.seg input:checked + label[data-tone="red"] { background: var(--red); border-color: var(--red); color: #26100b; }
.seg input:checked + label[data-tone="blue"] { background: var(--blue); border-color: var(--blue); color: #0b1a33; }
.seg input:focus-visible + label { outline: 2px solid #fff; outline-offset: 2px; }
fieldset:disabled .seg label { opacity: .5; cursor: default; }
.hint { margin: 8px 0 0; font-size: 14px; color: var(--mute); min-height: 2.8em; }

.pitch-row { display: flex; gap: 14px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.pitch-row .hint { margin: 0; min-height: 0; flex: 1 1 160px; }
.pitch-prev svg { display: block; max-width: 100%; height: auto; }
.pv-field { fill: #55704a; stroke: #c7e6bd; stroke-width: 1.2; }
.pv-line { stroke: #c7e6bd; stroke-width: 1; fill: none; }
.pv-goal { stroke: none; }
.pv-red { fill: var(--red); } .pv-blue { fill: var(--blue); }
.sliders { display: grid; gap: 8px; margin-top: 10px; }
.slider { display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px; align-items: center; font-size: 14px; color: var(--mute); }
.slider output { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
.slider input { width: 100%; min-width: 0; accent-color: var(--lime); }

.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg);
  font: 700 17px var(--f-display); padding: 13px 18px; border-radius: 10px; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: #46604f; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .back:focus-visible, .mode:focus-visible, .chip:focus-visible, .team:focus-visible, .tab:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.btn.go { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); font-size: 19px; padding: 14px 18px; }
.btn.go:hover:not(:disabled) { background: #d6efcd; }
.btn.sm { font-size: 14px; padding: 8px 12px; border-radius: 8px; }
.btn.go.sm { font-size: 15px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 auto; }

/* ---------- Inicio ---------- */
.modes { display: grid; grid-template-columns: 1fr; gap: 12px; }
.mode {
  appearance: none; text-align: left; cursor: pointer; color: var(--fg);
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  display: grid; gap: 6px; grid-template-columns: 64px 1fr; grid-template-areas: "i t" "i d"; align-items: center; column-gap: 14px;
}
.mode:hover { border-color: var(--lime); background: var(--panel-3); }
.mode-i { grid-area: i; } .mode-i svg { width: 64px; height: 40px; display: block; }
.mode-t { grid-area: t; font: 700 20px var(--f-display); }
.mode-d { grid-area: d; color: var(--mute); font-size: 14px; }
details.keys { border-top: 1px solid var(--line); padding-top: 14px; color: var(--mute); font-size: 14px; }
details.keys summary { cursor: pointer; font: 600 13px var(--f-body); letter-spacing: .08em; text-transform: uppercase; }
details.keys div { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
details.keys b { color: var(--fg); font-weight: 600; min-width: 62px; display: inline-block; }
kbd { font: 600 12px var(--f-display); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 7px; }
.soundbtn { align-self: flex-start; }

/* ---------- Mundial ---------- */
.kit { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #101412; flex: none; box-sizing: border-box; vertical-align: middle; }
.kit.big { width: 34px; height: 34px; border-width: 3px; }
.resume { display: flex; gap: 12px; align-items: center; background: var(--panel-2); border: 1px solid var(--lime); border-radius: 10px; padding: 12px; flex-wrap: wrap; }
.resume-t { display: grid; flex: 1 1 160px; min-width: 0; } .resume-t span { color: var(--mute); font-size: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font: 600 13px var(--f-body); padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.chip.on { background: rgba(199, 230, 189, .16); border-color: var(--lime); color: var(--lime); }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 8px; }
.team {
  appearance: none; text-align: left; cursor: pointer; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; grid-template-areas: "k c" "n n" "s s";
}
.team .kit { grid-area: k; width: 22px; height: 22px; } .team .tc { grid-area: c; font: 700 17px var(--f-display); }
.team .tn { grid-area: n; font-size: 14px; } .team .ts { grid-area: s; color: var(--gold); font-size: 13px; letter-spacing: .1em; }
.team:hover { border-color: #46604f; } .team.on { border-color: var(--lime); background: rgba(199, 230, 189, .12); }
.teamfoot { position: sticky; bottom: -24px; margin: 0 -24px -24px; padding: 14px 24px; background: var(--panel); border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.teamfoot-t { display: grid; flex: 1 1 140px; min-width: 0; } .teamfoot-t span { color: var(--mute); font-size: 13px; }
.teamfoot .btn { flex: 0 0 auto; }

.hubhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ht { display: grid; flex: 1 1 200px; min-width: 0; } .ht b { font: 700 22px var(--f-display); } .ht span { color: var(--mute); font-size: 14px; }
.hbtn { display: flex; gap: 8px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--mute); font: 700 16px var(--f-display); padding: 10px 16px; cursor: pointer; margin-bottom: -1px; }
.tab.on { color: var(--lime); border-bottom-color: var(--lime); }
.hubbody { display: grid; gap: 16px; min-width: 0; }
.next { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
.next.gold { border-color: var(--gold); } .next.gold h3 { color: var(--gold); } .next.out { border-color: var(--bad); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.side { display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; } .side b { font: 700 20px var(--f-display); overflow-wrap: anywhere; } .side span { color: var(--gold); font-size: 13px; letter-spacing: .1em; }
.vsx { font: 700 18px var(--f-display); color: var(--mute); }
.panel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.res { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; font-size: 14px; padding: 5px 6px; border-radius: 6px; }
.res.me { background: rgba(199, 230, 189, .13); font-weight: 600; }
.res .ra { display: flex; gap: 6px; align-items: center; justify-content: flex-end; text-align: right; min-width: 0; }
.res .rb { display: flex; gap: 6px; align-items: center; min-width: 0; }
.res .rs { font: 700 15px var(--f-display); text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.res .rt { grid-column: 1 / -1; text-align: center; color: var(--mute); font-size: 12px; font-style: normal; }
.podium { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.podium li { display: flex; gap: 10px; align-items: center; } .podium li > span:last-child { color: var(--mute); margin-left: auto; font-size: 14px; }
.gtabs { display: grid; grid-template-columns: 1fr; gap: 12px; }
.gt.mine { border-color: var(--lime); }
.tablewrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: right; color: var(--mute); font: 600 12px var(--f-body); padding: 4px 6px; } .tbl th:nth-child(2) { text-align: left; }
.tbl td { padding: 6px; text-align: right; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
.tbl td.pos { text-align: left; width: 22px; color: var(--mute); } .tbl td.tm { text-align: left; } .tbl td.tm span { margin-left: 8px; } .tbl td.pts { font-weight: 700; }
.tbl tr.q td.pos { color: var(--ok); box-shadow: inset 3px 0 var(--ok); } .tbl tr.q3 td.pos { box-shadow: inset 3px 0 var(--gold); }
.tbl tr.me td { background: rgba(199, 230, 189, .13); font-weight: 600; }
.mini { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--mute); font-size: 13px; } .mini .me { color: var(--lime); }
.bracketwrap { overflow-x: auto; padding-bottom: 8px; }
.bracket { display: flex; gap: 14px; min-width: max-content; align-items: stretch; }
.bcol { display: flex; flex-direction: column; gap: 10px; width: 168px; }
.bcm { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 8px; }
.bcol.now h4 { color: var(--lime); }
.bm { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: grid; gap: 2px; font-size: 14px; }
.bm.mine { border-color: var(--lime); } .bm.empty { color: var(--mute); }
.bm em { font-size: 11px; color: var(--mute); font-style: normal; letter-spacing: .06em; text-transform: uppercase; } .bm small { color: var(--mute); font-size: 11px; }
.bt { display: flex; gap: 8px; align-items: center; } .bt.w { font-weight: 700; } .bt.me .bn { color: var(--lime); } .bt .bg { margin-left: auto; font: 700 15px var(--f-display); font-variant-numeric: tabular-nums; }

/* ---------- Penales ---------- */
.pk-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; text-align: left; }
.pk-row b { font: 600 15px var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-dots { display: inline-flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.pk-dots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--mute); box-sizing: border-box; }
.pk-dots i.ok { background: var(--ok); border-color: var(--ok); } .pk-dots i.no { background: var(--bad); border-color: var(--bad); }

/* ---------- Fin de partido / pausa ---------- */
#endTitle[data-res="win"] { color: var(--lime); } #endTitle[data-res="lose"] { color: var(--red); }
#endScore { font: 700 56px/1 var(--f-display); display: flex; justify-content: center; gap: 16px; align-items: center; font-variant-numeric: tabular-nums; }
#endScore i { color: var(--mute); font-style: normal; }
.endnames { margin: 0; display: flex; justify-content: space-between; gap: 12px; color: var(--mute); font-size: 14px; }
#endMeta { margin: 0; color: var(--mute); font-size: 15px; }

#pauseBtn {
  position: fixed; z-index: 4; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: rgba(8, 12, 10, .72); display: flex; gap: 5px; align-items: center; justify-content: center; cursor: pointer; padding: 0;
}
#pauseBtn span { width: 4px; height: 16px; background: var(--fg); border-radius: 2px; }
#pauseBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

#touch { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
#stickBase { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .06); display: none; }
#stickBase.on { display: block; }
#stickKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, .4); transform: translate(-50%, -50%); }
#kickBtn {
  position: fixed; pointer-events: auto; touch-action: none;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 8px); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 14px);
  width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .55);
  background: rgba(255, 255, 255, .12); color: #fff; font: 700 15px var(--f-display); letter-spacing: .06em; text-transform: uppercase;
}
#kickBtn.on { background: rgba(255, 255, 255, .5); border-color: #fff; color: #111; }
#callBtn {
  position: fixed; pointer-events: auto; touch-action: none;
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 20px); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 124px);
  width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(199, 230, 189, .6);
  background: rgba(199, 230, 189, .12); color: #e9f0ea; font: 700 13px var(--f-display); letter-spacing: .06em; text-transform: uppercase;
}
#callBtn.on { background: rgba(199, 230, 189, .55); color: #111; }

@media (min-width: 700px) {
  .groups { grid-template-columns: 1fr 1fr; }
  .groups .g-size, .groups .g-diff, .groups .g-format, .groups .g-pitch { grid-column: 1 / -1; }
  .modes { grid-template-columns: repeat(2, 1fr); }
  .mode { grid-template-columns: 1fr; grid-template-areas: "i" "t" "d"; align-content: start; row-gap: 8px; }
  .mode-i svg { width: 76px; height: 48px; }
  .teamcols { grid-template-columns: repeat(3, 1fr); }
  .gtabs { grid-template-columns: 1fr 1fr; }
}
@media (max-height: 520px) {
  .card { padding: 16px; gap: 12px; }
  h1 { font-size: 26px; }
  details.keys { display: none; }
}
@media (max-width: 480px) {
  .card { padding: 18px; }
  .slider { grid-template-columns: 92px 1fr 40px; }
  .teamfoot { margin: 0 -18px -18px; padding: 12px 18px; bottom: -18px; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="pauseBtn" type="button" aria-label="Menú" hidden><span></span><span></span></button>
<div id="touch" hidden>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <button id="kickBtn" type="button">Patear</button>
  <button id="callBtn" type="button">Pedir</button>
</div>
<script>
'use strict';
/* ===== Motor compartido (navegador y servidor): física + bots ===== */
const C = {
  ballR: 10, playerR: 15, postR: 8, goalDepth: 40,
  acc: 0.1, kickAcc: 0.07, pDamp: 0.96, bDamp: 0.99, kickStr: 5, kickRange: 4,
  pBC: 0.5, bBC: 0.5, postBC: 0.5, wallBC: 1, goalTicks: 150, goldenTicks: 3600
};

/* física: "futsal" es la de los mapas de futsal de Bazinga (pelota chica y liviana, jugadores sin rebote);
   "classic" es la de la cancha clásica de HaxBall (se usa en los penales) */
const PHYS = {
  futsal: { acc: 0.11, kickAcc: 0.083, kickStr: 5, playerBC: 0, ballR: 6.25, ballInvMass: 1.5, ballBC: 0.4 },
  classic: { acc: 0.1, kickAcc: 0.07, kickStr: 5, playerBC: 0.5, ballR: 10, ballInvMass: 1, ballBC: 0.5 }
};

const PITCHES = {
  futsal:  { label: 'Futsal Bazinga', W: 368, H: 171, gh: 62, kr: 65, bySize: { 1: { W: 368, H: 171, gh: 62, kr: 65 }, 2: { W: 368, H: 171, gh: 62, kr: 65 }, 3: { W: 550, H: 240, gh: 80, kr: 80 }, 4: { W: 700, H: 320, gh: 90, kr: 80 } } },
  small:   { label: 'Chica',   W: 290, H: 130, gh: 55 },
  classic: { label: 'Clásica', W: 370, H: 170, gh: 64 },
  big:     { label: 'Grande',  W: 520, H: 240, gh: 85 },
  huge:    { label: 'Enorme',  W: 700, H: 320, gh: 110 }
};
const PITCH_LIMITS = { W: [220, 800], H: [100, 380], gh: [40, 130] };

const DIFF = {
  easy:   { key: 'easy',   label: 'Fácil',   think: 18, speed: 0.72, predict: 0,    aimErr: 0.5,   kickTol: 0.85, sloppy: 0.14, gkSkill: 0.35 },
  normal: { key: 'normal', label: 'Normal',  think: 11, speed: 0.86, predict: 0.45, aimErr: 0.22,  kickTol: 0.5,  sloppy: 0.05, gkSkill: 0.65 },
  hard:   { key: 'hard',   label: 'Difícil', think: 5,  speed: 0.96, predict: 0.85, aimErr: 0.08,  kickTol: 0.28, sloppy: 0.01, gkSkill: 0.9 },
  expert: { key: 'expert', label: 'Experto', think: 2,  speed: 1,    predict: 1,    aimErr: 0.015, kickTol: 0.14, sloppy: 0,    gkSkill: 1 },
  impossible: { key: 'impossible', label: 'Imposible', think: 1, speed: 1, kick: 1, v2: true, rt: 11, predict: 1, aimErr: 0, kickTol: 0.06, sloppy: 0, gkSkill: 1, smart: true, press: true, attack: true, guard: false, aim: true, wall: true, sure: true, engage: true, cover: true, clear: true }
};

/* Posiciones de saque para el equipo de la izquierda, en la cancha clásica */
const FORM = { 1: [[170, 0]], 2: [[140, -50], [270, 50]], 3: [[140, 0], [240, -100], [330, 0]] };
const BOT_NAMES = [['Tano', 'Beto', 'Nacho', 'Gero'], ['Luca', 'Pipa', 'Tito', 'Lolo']];

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);

function makeGeo(p) {
  p = p || PITCHES.classic;
  const W = clamp(Math.round(+p.W || 370), PITCH_LIMITS.W[0], PITCH_LIMITS.W[1]);
  const H = clamp(Math.round(+p.H || 170), PITCH_LIMITS.H[0], PITCH_LIMITS.H[1]);
  const gh = clamp(Math.round(+p.gh || 64), PITCH_LIMITS.gh[0], Math.min(PITCH_LIMITS.gh[1], H - 25));
  const d = C.goalDepth;
  const geo = {
    W, H, gh, d, boxW: W + 50, boxH: H + 30,
    kr: p.kr ? clamp(Math.round(+p.kr), 30, 130) : clamp(Math.round(H * 0.44), 45, Math.min(125, Math.floor(W * 0.32))),
    kx: W / 370, ky: H / 170, segs: []
  };
  const s = geo.segs;
  s.push([-W, -H, W, -H], [-W, H, W, H]);
  for (const sx of [-1, 1]) {
    s.push([sx * W, -H, sx * W, -gh], [sx * W, gh, sx * W, H]);
    s.push([sx * W, -gh, sx * (W + d), -gh], [sx * W, gh, sx * (W + d), gh], [sx * (W + d), -gh, sx * (W + d), gh]);
  }
  return geo;
}

function mkDisc(x, y, r, invMass, bCoef) {
  return { x, y, px: x, py: y, vx: 0, vy: 0, r, invMass, bCoef };
}

function defaultRoster(cfg) {
  const roster = [];
  for (let team = 0; team < 2; team++) {
    for (let i = 0; i < cfg.size; i++) {
      roster.push({ team, human: team === cfg.humanTeam && i === 0, name: team === cfg.humanTeam && i === 0 ? 'Vos' : null });
    }
  }
  return roster;
}

/*
 cfg: { size, diff, humanTeam, timeLimit (min), scoreLimit, pitch:{W,H,gh}, allowDraw,
        roster?:[{team,human,name,diff}], teamNames?:[a,b], kits?, ... }
*/
function createGame(cfg) {
  const geo = makeGeo(cfg.pitch);
  const G = {
    cfg, geo, phys: PHYS[cfg.physics] || PHYS.futsal, kits: cfg.kits || null, players: [], ball: null, posts: [], nTeam: [0, 0],
    score: [0, 0], tick: 0, playTicks: 0, phase: 'kickoff', kickTeam: 0,
    goalTimer: 0, lastGoalTeam: -1, lastTouch: null, tied: false, overtime: false, otTicks: 0, manual: !!cfg.manual, over: false,
    winner: -1, pendingEnd: false, banner: null, events: [], humanTeam: cfg.humanTeam
  };
  G.ball = mkDisc(0, 0, G.phys.ballR, G.phys.ballInvMass, G.phys.ballBC);
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    G.posts.push(mkDisc(sx * geo.W, sy * geo.gh, C.postR, 0, C.postBC));
  }
  const roster = cfg.roster || defaultRoster(cfg);
  for (const r of roster) {
    const team = r.team, idx = G.nTeam[team]++;
    const p = mkDisc(0, 0, C.playerR, 0.5, G.phys.playerBC);
    p.acc0 = G.phys.acc; p.kacc0 = G.phys.kickAcc;
    p.team = team; p.idx = idx; p.human = !!r.human; p.me = false;
    p.name = r.name || BOT_NAMES[team][idx % BOT_NAMES[team].length];
    p.in = { dx: 0, dy: 0, kick: false };
    p.armed = true; p.flash = 0;
    const dk = r.diff || (cfg.diffTeams ? cfg.diffTeams[team] : cfg.diff);
    p.diff = DIFF[dk] || DIFF.normal;
    p.ai = { next: 0, tx: 0, ty: 0, kick: false, precise: false, chaser: false };
    G.players.push(p);
  }
  resetKickoff(G, 0);
  return G;
}

function formPos(G, p) {
  const n = clamp(G.nTeam[p.team], 1, 3), g = G.geo;
  const f = FORM[n][Math.min(p.idx, n - 1)];
  const x = Math.max(f[0] * g.kx, g.kr + C.playerR + 12);
  return [(p.team === 0 ? -1 : 1) * Math.min(x, g.W - 30), f[1] * g.ky];
}

function resetKickoff(G, kickTeam) {
  G.phase = 'kickoff'; G.kickTeam = kickTeam; G.lastTouch = null;
  const b = G.ball; b.x = b.px = 0; b.y = b.py = 0; b.vx = b.vy = 0;
  for (const p of G.players) {
    const f = formPos(G, p);
    p.x = p.px = f[0]; p.y = p.py = f[1];
    p.vx = p.vy = 0; p.armed = true; p.flash = 0;
    p.ai.next = 0; p.ai.kick = false;
  }
}

function ev(G, t) { if (G.events.length < 64) G.events.push(t); }

/* pedir la pelota: los compañeros de la máquina buscan pasársela al que la pidió (dura 2 segundos) */
function callForBall(G, p) {
  if (!p || G.nTeam[p.team] < 2) return false;
  G.call = { p, until: G.tick + 120 };
  return true;
}
function callerFor(G, p) {
  const c = G.call;
  if (!c || G.tick > c.until || c.p === p || c.p.team !== p.team) return null;
  return c.p;
}

function touchBall(G, p) {
  G.lastTouch = p;
  if (G.call && (G.call.p === p || G.call.p.team !== p.team)) G.call = null;
  if (G.phase === 'kickoff') G.phase = 'play';
}

function discDisc(a, b) {
  let dx = b.x - a.x, dy = b.y - a.y;
  const rr = a.r + b.r, d2 = dx * dx + dy * dy;
  if (d2 >= rr * rr) return 0;
  let d = Math.sqrt(d2);
  if (d === 0) { dx = 1; dy = 0; d = 1; }
  const nx = dx / d, ny = dy / d, im = a.invMass + b.invMass;
  if (im === 0) return 0;
  const pen = rr - d;
  a.x -= nx * pen * a.invMass / im; a.y -= ny * pen * a.invMass / im;
  b.x += nx * pen * b.invMass / im; b.y += ny * pen * b.invMass / im;
  const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (vn < 0) {
    const j = -(1 + a.bCoef * b.bCoef) * vn / im;
    a.vx -= nx * j * a.invMass; a.vy -= ny * j * a.invMass;
    b.vx += nx * j * b.invMass; b.vy += ny * j * b.invMass;
  }
  return Math.max(0, -vn) + 0.0001;
}

function collideSeg(d, s) {
  const ax = s[0], ay = s[1], bx = s[2], by = s[3];
  const abx = bx - ax, aby = by - ay;
  const t = clamp(((d.x - ax) * abx + (d.y - ay) * aby) / (abx * abx + aby * aby), 0, 1);
  const dx = d.x - (ax + abx * t), dy = d.y - (ay + aby * t);
  const dist = Math.hypot(dx, dy);
  if (dist >= d.r || dist === 0) return 0;
  const nx = dx / dist, ny = dy / dist;
  d.x += nx * (d.r - dist); d.y += ny * (d.r - dist);
  const vn = d.vx * nx + d.vy * ny;
  if (vn < 0) {
    const j = -(1 + d.bCoef * C.wallBC) * vn;
    d.vx += nx * j; d.vy += ny * j;
    return -vn;
  }
  return 0;
}

/* Si en este tick la pelota atravesó una pared (empujada por un jugador o muy rápida), vuelve del lado de adentro */
function uncross(d, x0, y0, s) {
  const ax = s[0], ay = s[1], ex = s[2] - ax, ey = s[3] - ay;
  const s0 = ex * (y0 - ay) - ey * (x0 - ax), s1 = ex * (d.y - ay) - ey * (d.x - ax);
  if (s0 === 0 || (s0 > 0) === (s1 > 0)) return;
  const t = s0 / (s0 - s1), ix = x0 + (d.x - x0) * t, iy = y0 + (d.y - y0) * t;
  const L = Math.hypot(ex, ey), u = ((ix - ax) * ex + (iy - ay) * ey) / (L * L);
  if (u < 0 || u > 1) return;
  let nx = -ey / L, ny = ex / L; if (s0 < 0) { nx = -nx; ny = -ny; }
  d.x = ix + nx * d.r; d.y = iy + ny * d.r;
  const vn = d.vx * nx + d.vy * ny; if (vn < 0) { d.vx -= nx * vn * (1 + d.bCoef * C.wallBC); d.vy -= ny * vn * (1 + d.bCoef * C.wallBC); }
}

/* Límites de movimiento de un jugador (los usa step() y la predicción del cliente) */
function clampPlayerBox(geo, p) {
  const bx = geo.boxW - C.playerR, by = geo.boxH - C.playerR;
  if (p.x > bx) { p.x = bx; if (p.vx > 0) p.vx *= -0.1; }
  if (p.x < -bx) { p.x = -bx; if (p.vx < 0) p.vx *= -0.1; }
  if (p.y > by) { p.y = by; if (p.vy > 0) p.vy *= -0.1; }
  if (p.y < -by) { p.y = -by; if (p.vy < 0) p.vy *= -0.1; }
}

function kickoffLimit(G, p) {
  if (p.team === 0 && p.x > -p.r) { p.x = -p.r; if (p.vx > 0) p.vx = 0; }
  if (p.team === 1 && p.x < p.r) { p.x = p.r; if (p.vx < 0) p.vx = 0; }
  if (p.team !== G.kickTeam) {
    const d = Math.hypot(p.x, p.y), lim = G.geo.kr + p.r;
    if (d < lim) {
      if (d < 0.001) { p.x = (p.team === 0 ? -1 : 1) * lim; p.y = 0; }
      else {
        const k = lim / d, ux = p.x / d, uy = p.y / d;
        p.x *= k; p.y *= k;
        const vr = p.vx * ux + p.vy * uy;
        if (vr < 0) { p.vx -= vr * ux; p.vy -= vr * uy; }
      }
    }
  }
}

function step(G) {
  if (G.over) return;
  G.tick++;
  const ball = G.ball, P = G.players, geo = G.geo;
  if (!G.manual) for (const p of P) if (!p.human) aiUpdate(G, p);

  ball.px = ball.x; ball.py = ball.y;
  for (const p of P) {
    p.px = p.x; p.py = p.y;
    if (p.flash > 0) p.flash--;
    const inp = p.in;
    let dx = inp.dx, dy = inp.dy;
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    const a = (inp.kick ? p.kacc0 : p.acc0) * (p.human ? 1 : p.diff.speed) * (p.accMul || 1);
    p.vx += dx * a; p.vy += dy * a;
    if (inp.kick && !p.noKick && !p.noBall) {
      if (p.armed) {
        const ddx = ball.x - p.x, ddy = ball.y - p.y, d = Math.hypot(ddx, ddy);
        if (d > 0 && d - p.r - ball.r < C.kickRange) {
          const ks = G.phys.kickStr * (p.human ? 1 : (p.diff.kick || 1));
          ball.vx += ddx / d * ks * ball.invMass;
          ball.vy += ddy / d * ks * ball.invMass;
          p.armed = false; p.flash = 10;
          touchBall(G, p); ev(G, 'kick');
        }
      }
    } else p.armed = true;
  }

  for (const p of P) { p.x += p.vx; p.y += p.vy; }
  const bx0 = ball.x, by0 = ball.y;
  ball.x += ball.vx; ball.y += ball.vy;

  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) discDisc(P[i], P[j]);
  for (const p of P) if (!p.noBall && discDisc(p, ball)) touchBall(G, p);
  for (const post of G.posts) {
    for (const p of P) discDisc(post, p);
    if (discDisc(post, ball) > 1.5) ev(G, 'wall');
  }
  for (const s of geo.segs) uncross(ball, bx0, by0, s);
  for (const s of geo.segs) if (collideSeg(ball, s) > 2.5) ev(G, 'wall');

  for (const p of P) clampPlayerBox(geo, p);
  if (G.phase === 'kickoff') for (const p of P) kickoffLimit(G, p);

  for (const p of P) { const dm = p.damp || C.pDamp; p.vx *= dm; p.vy *= dm; }
  ball.vx *= C.bDamp; ball.vy *= C.bDamp;

  if (G.banner && G.banner.t > 0) G.banner.t--;

  if (G.phase === 'play') {
    G.playTicks++;
    if (ball.x < -geo.W) goal(G, 1);
    else if (ball.x > geo.W) goal(G, 0);
    else if (G.cfg.timeLimit > 0 && !G.overtime && G.playTicks >= G.cfg.timeLimit * 3600) {
      const tt = totals(G);
      if (tt[0] !== tt[1] || G.cfg.allowDraw) finish(G);   // la fase de grupos admite empates; en una vuelta cuenta el global
      else {
        /* empate en un partido que no admite empate: gol de oro de 1 minuto */
        G.overtime = true; G.otTicks = 0;
        G.banner = { text: 'Gol de oro', sub: '1 minuto · el próximo gol gana', team: -1, t: 150 };
        ev(G, 'overtime');
      }
    } else if (G.overtime && ++G.otTicks >= C.goldenTicks) {
      /* nadie convirtió: se define por penales (lo resuelve la interfaz) */
      G.tied = true;
      finish(G);
    }
  } else if (G.phase === 'goal') {
    G.goalTimer--;
    if (G.goalTimer <= 0) {
      if (G.pendingEnd) finish(G);
      else resetKickoff(G, 1 - G.lastGoalTeam);
    }
  }
}

function teamName(G, t) {
  return (G.cfg.teamNames && G.cfg.teamNames[t]) || (t === 0 ? 'Rojo' : 'Azul');
}

function goal(G, team) {
  G.score[team]++;
  G.phase = 'goal'; G.goalTimer = C.goalTicks; G.lastGoalTeam = team;
  const sc = G.lastTouch, own = !!sc && sc.team !== team;
  G.banner = {
    text: '¡GOL!', team,
    sub: teamName(G, team) + (sc ? ' · ' + sc.name : '') + (own ? ' (en contra)' : ''),
    t: C.goalTicks
  };
  const lim = G.cfg.scoreLimit;
  G.pendingEnd = (lim > 0 && G.score[team] >= lim) || G.overtime;
  ev(G, 'goal');
}

/* goles que definen: el resultado del partido, más los de la ida si es una vuelta (cfg.agg) */
function totals(G) {
  const a = G.cfg.agg;
  return a ? [G.score[0] + a[0], G.score[1] + a[1]] : G.score;
}

function finish(G) {
  G.over = true;
  const tt = totals(G);
  G.winner = tt[0] === tt[1] ? -1 : (tt[0] > tt[1] ? 0 : 1);
  ev(G, 'end');
}

/* ===== Bots ===== */
function predictBall(G, steps) {
  const b = G.ball, g = G.geo, bc = b.bCoef * C.wallBC;
  let x = b.x, y = b.y, vx = b.vx, vy = b.vy;
  const H = g.H - b.r, W = g.W - b.r, mouth = g.gh - b.r;
  for (let i = 0; i < steps; i++) {
    x += vx; y += vy; vx *= C.bDamp; vy *= C.bDamp;
    if (y > H) { y = H; vy = -vy * bc; } else if (y < -H) { y = -H; vy = -vy * bc; }
    if (Math.abs(y) > mouth) {
      if (x > W) { x = W; vx = -vx * bc; } else if (x < -W) { x = -W; vx = -vx * bc; }
    }
  }
  return { x, y };
}

function predictCross(G, ownX, dir) {
  const b = G.ball, g = G.geo, bc = b.bCoef * C.wallBC;
  if (b.vx * dir > -0.3) return null;
  let x = b.x, y = b.y, vx = b.vx, vy = b.vy;
  const H = g.H - b.r;
  const horizon = clamp(Math.ceil(Math.abs(b.x - ownX) / Math.max(0.3, Math.abs(b.vx)) * 1.6) + 10, 30, 500);
  for (let i = 0; i < horizon; i++) {
    x += vx; y += vy; vx *= C.bDamp; vy *= C.bDamp;
    if (y > H) { y = H; vy = -vy * bc; } else if (y < -H) { y = -H; vy = -vy * bc; }
    if ((x - ownX) * dir < 0) return Math.abs(y) < g.gh + 6 ? { t: i, y } : null;
  }
  return null;
}

function aiUpdate(G, p) {
  const A = p.ai, D = p.diff;
  if (D.smart) return smTick(G, p);
  if (G.phase === 'goal') { p.in.dx = p.in.dy = 0; p.in.kick = false; return; }
  if (G.tick >= A.next) {
    aiDecide(G, p);
    A.next = G.tick + D.think + (Math.random() < 0.35 ? Math.floor(Math.random() * D.think * 0.6) : 0);
  }
  let dx = A.tx - p.x, dy = A.ty - p.y;
  const d = Math.hypot(dx, dy);
  if (d < 3) { dx = dy = 0; }
  else {
    const m = A.precise ? Math.min(1, d / 40) : 1;
    dx = dx / d * m; dy = dy / d * m;
    if (A.precise) { dx -= p.vx * 0.5; dy -= p.vy * 0.5; }
  }
  p.in.dx = dx; p.in.dy = dy; p.in.kick = A.kick;
  /* pase pedido: se decide en cada tick, para patear justo cuando la pelota sale hacia el compañero */
  const caller = A.chaser ? callerFor(G, p) : null;
  if (caller) {
    const b = G.ball, bd = Math.hypot(b.x - p.x, b.y - p.y) || 1;
    /* ponerse detrás de la pelota en la línea del pase y salir derecho */
    let sx = caller.x + caller.vx * 12 - b.x, sy = caller.y + caller.vy * 12 - b.y; const sl = Math.hypot(sx, sy) || 1; sx /= sl; sy /= sl;
    const R2 = p.r + b.r, al = (p.x - b.x) * sx + (p.y - b.y) * sy, la = (p.x - b.x) * -sy + (p.y - b.y) * sx;
    let gx, gy;
    if (al < -R2 * 0.6 && Math.abs(la) < 6) { gx = b.x; gy = b.y; }
    else if (al < -R2 * 0.6) { gx = b.x - sx * (R2 + 6); gy = b.y - sy * (R2 + 6); }
    else { const sd = la >= 0 ? 1 : -1; gx = b.x - sx * (R2 + 16) - sy * sd * (R2 + 14); gy = b.y - sy * (R2 + 16) + sx * sd * (R2 + 14); }
    let mx = gx - p.x, my = gy - p.y; const ml = Math.hypot(mx, my) || 1;
    p.in.dx = mx / ml - p.vx * 0.15; p.in.dy = my / ml - p.vy * 0.15;
    const ux = (b.x - p.x) / bd, uy = (b.y - p.y) / bd;
    let tx = caller.x + caller.vx * 12 - b.x, ty = caller.y + caller.vy * 12 - b.y; const tl = Math.hypot(tx, ty) || 1;
    const ang = Math.acos(clamp((ux * tx + uy * ty) / tl, -1, 1));
    p.in.kick = bd - p.r - b.r < C.kickRange + 1 && ang < 0.09 + D.aimErr * 0.05;
  }
}

function aiDecide(G, p) {
  const A = p.ai, D = p.diff, ball = G.ball, g = G.geo;
  const dir = p.team === 0 ? 1 : -1, W = g.W, H = g.H, gh = g.gh, kx = g.kx, ky = g.ky;
  const ownX = -dir * W, oppX = dir * W;
  A.kick = false; A.precise = false;

  const mates = G.players.filter(q => q.team === p.team);
  /* con 3 o más, el último hombre cuida el arco y sólo sale si la pelota está encima */
  let lastMan = null;
  const incoming = ball.vx * dir < -1.8;
  if (mates.length >= 3 && (Math.abs(ball.x - ownX) > 140 * kx || incoming)) {
    lastMan = mates.reduce((a, b) => (dir * b.x < dir * a.x ? b : a));
  }
  let chaser = mates[0] === lastMan ? mates[1] : mates[0], best = 1e9;
  for (const q of mates) {
    if (q === lastMan) continue;
    const s = Math.hypot(ball.x - q.x, ball.y - q.y) - (q.ai.chaser ? 22 : 0);
    if (s < best) { best = s; chaser = q; }
  }
  for (const q of mates) q.ai.chaser = q === chaser;

  let role = 'chase';
  if (chaser !== p) {
    const others = mates.filter(q => q !== chaser).sort((a, b) => dir * a.x - dir * b.x);
    role = others.length === 1 ? 'defend' : (others[0] === p ? 'keeper' : 'support');
  }

  if (role === 'keeper') {
    A.precise = true;
    let gy = clamp(ball.y * 0.4, -gh * 0.81, gh * 0.81);
    const cr = predictCross(G, ownX, dir);
    if (cr && Math.random() < D.gkSkill) gy = clamp(cr.y, -gh * 0.88, gh * 0.88);
    A.tx = ownX + dir * (30 * Math.sqrt(kx) + (1 - D.gkSkill) * 20); A.ty = gy;
    return;
  }
  if (role === 'defend') {
    A.precise = true;
    let tx = ownX + (ball.x - ownX) * 0.42;
    if (dir * tx > -40 * kx) tx = -dir * 40 * kx;
    A.tx = tx; A.ty = clamp(ball.y * 0.42, -H * 0.7, H * 0.7);
    return;
  }
  if (role === 'support') {
    A.precise = true;
    A.tx = clamp(ball.x + dir * 110 * kx, -(W - 40), W - 40);
    A.ty = clamp(ball.y > 0 ? ball.y - 95 * ky : ball.y + 95 * ky, -H * 0.82, H * 0.82);
    return;
  }

  /* jugador solo: si viene un tiro al arco, vuelve a taparlo */
  if (mates.length === 1 && incoming) {
    const cr = predictCross(G, ownX, dir);
    if (cr && Math.random() < D.gkSkill) {
      A.precise = true;
      A.tx = ownX + dir * 30 * Math.sqrt(kx); A.ty = clamp(cr.y, -gh * 0.88, gh * 0.88);
      return;
    }
  }

  /* chaser */
  const dist = Math.hypot(ball.x - p.x, ball.y - p.y);
  const look = Math.round(D.predict * clamp(dist / 2, 0, 50));

  let gk = null, gd = 1e9;

  aimY += rnd(-1, 1) * D.aimErr * gh * 2.2;
  const caller = callerFor(G, p);
  let aimX = oppX;
  if (caller) { aimX = caller.x + caller.vx * 12; aimY = caller.y + caller.vy * 12; }   // me la pidieron: apuntar al compañero
  let sx = aimX - bp.x, sy = aimY - bp.y;
  const sl = Math.hypot(sx, sy) || 1; sx /= sl; sy /= sl;

  const qx = p.x - bp.x, qy = p.y - bp.y;
  const a = qx * sx + qy * sy, l = qx * nx + qy * ny;

    else { const back = 30 + clamp(-a * 0.15, 0, 40); tx = bp.x - sx * back; ty = bp.y - sy * back; }

  }
  A.tx = clamp(tx, -g.boxW + 20, g.boxW - 20);
  A.ty = clamp(ty, -g.boxH + 20, g.boxH - 20);

  /* patear */
  const range = dist - R;
  if (range < 12) {
    const ux = (ball.x - p.x) / (dist || 1), uy = (ball.y - p.y) / (dist || 1);
    const ang = Math.acos(clamp(ux * sx + uy * sy, -1, 1));
    const toGoal = Math.abs(oppX - ball.x);
    const allowed = toGoal < 380 * kx || ball.x * dir < -20;
    const safe = !!caller || !(ux * dir < -0.4 && ball.x * dir < -W * 0.54 && Math.abs(ball.y) < H * 0.65);
    let pressed = false;
    for (const q of G.players) {
      if (q.team !== p.team && Math.hypot(q.x - p.x, q.y - p.y) < 36) { pressed = true; break; }
    }

  }
}

/* ===== Bot "Imposible" =====
   Juega "pensando" cada acción antes de hacerla:
   - predice el recorrido de la pelota (con rebotes) y calcula cuántos ticks tarda cada jugador en llegar;
   - con la pelota, evalúa muchas acciones simulándolas: tiros al arco (directos y de rebote), pases a cada
     compañero (directos y por la pared), pases al espacio para sí mismo (para eludir) y seguir conduciendo.
     Cada acción vale según la chance de gol o de que la pelota la vuelva a tomar su equipo y en qué lugar;
   - sin la pelota, se desmarca a un lugar libre adelante para recibir;
   - si el rival tiene la pelota, se para entre la pelota y su arco, marca al rival libre y tapa los tiros
     yendo al punto del recorrido que alcanza primero.
   En cada tick, si tiene la pelota al alcance, compara patear ahora contra seguir con su plan. */

const SM = { tables: {}, inv: {}, BPx: new Float64Array(181), BPy: new Float64Array(181), BPvx: new Float64Array(181), BPvy: new Float64Array(181),
  SPx: new Float64Array(181), SPy: new Float64Array(181), pw: null };
(function () { SM.pw = new Float64Array(401); let v = 1; for (let n = 0; n <= 400; n++) { SM.pw[n] = v; v *= C.pDamp; } })();
const SM_SHOT = 600;     // lo que vale un gol en la escala de las acciones

function smAcc(p) { return (p.acc0 || C.acc) * (p.human ? 1 : p.diff.speed) * (p.accMul || 1); }
/* tabla: distancia recorrida desde parado en n ticks, y su inversa (distancia -> ticks) */
function smTable(a) {

  for (let n = 1; n <= 400; n++) { v = (v + a) * C.pDamp; s += v; t[n] = s; }
  const inv = new Uint16Array(2001); let n = 0;
  for (let d = 0; d <= 2000; d++) { while (n < 400 && t[n] < d) n++; inv[d] = n; }
  SM.inv[key] = inv;

/* ticks que tarda q en quedar a "near" de (x, y), teniendo en cuenta su velocidad actual */
function smReach(q, x, y, near) {

/* recorrido de la pelota: llena xs/ys(/vxs/vys) hasta n ticks; devuelve el equipo que hace el gol (o -1) y en qué tick */
function smSim(G, x, y, vx, vy, n, xs, ys, vxs, vys) {

    if (Math.abs(y) > mouth) {
      if (x > W) { x = W; vx = -vx * bc; } else if (x < -W) { x = -W; vx = -vx * bc; }
    } else if (x > g.W) { xs[i] = x; ys[i] = y; return { goal: 0, t: i, n: i }; }
    else if (x < -g.W) { xs[i] = x; ys[i] = y; return { goal: 1, t: i, n: i }; }
    vx *= C.bDamp; vy *= C.bDamp;

/* el primer tick en que q alcanza la pelota que sigue el recorrido BP */
function smIntercept(G, q, n) {

  for (let t = 0; t <= n; t++) if (smReach(q, SM.BPx[t], SM.BPy[t], near) <= t) return t;
  return n + smReach(q, SM.BPx[n], SM.BPy[n], near);

const smSig = x => 1 / (1 + Math.exp(-x));
/* valor de tener la pelota en (x, y) para el equipo "team", y peligro de perderla ahí */
function smPos(G, team, x, y) {
  const g = G.geo, dir = team === 0 ? 1 : -1, prog = clamp((x * dir + g.W) / (2 * g.W), 0, 1);

/* dónde pararse para tapar el arco desde la pelota en (px, py): prueba puntos alrededor de la pelota y elige el que deja menos hueco (sirve para ángulos cerrados),

/* valor de patear la pelota desde (bx, by) con velocidad (vx, vy): gol, pase, pase al espacio o pérdida */
/* ticks que tarda un rival humano en reaccionar a una patada nueva (la máquina lo tiene en cuenta en Imposible) */
const smLag = (p, q) => (p.diff.v2 && (q.human || q.diff.slow) ? p.diff.rt || 0 : 0);

function smEval(G, p, bx, by, vx, vy) {
  const team = p.team, br = G.ball.r;

  if (p.diff.v2) {
    /* nunca mandarla cerca de mi arco (los palos pueden meterla aunque la simulación diga que pega afuera) */
    const ox = team === 0 ? -G.geo.W : G.geo.W, rad = Math.min(G.geo.gh + 34, Math.hypot(bx - ox, by) - 6);   // si ya está encima del arco: que al menos se aleje
    const d1 = Math.hypot(SM.SPx[1] - ox, SM.SPy[1]);

  }
  /* cuerpos en el camino en los primeros ticks (la simulación de la pelota no ve a los jugadores) */
  for (let k = 2; k <= Math.min(14, n); k++) {
    for (const q of G.players) {
      const qx = q.x + q.vx * k * 0.6, qy = q.y + q.vy * k * 0.6;
      if (Math.hypot(SM.SPx[k] - qx, SM.SPy[k] - qy) < q.r + br - 1) {
        if (q === p) return { v: -300, kind: 'blocked' };                       // se la tira encima (contra la pared)
        if (q.team !== team) return { v: -0.6 * smDanger(G, team, SM.SPx[k], SM.SPy[k]), kind: 'blocked' };

    /* tiro: cuánto margen le queda al rival que mejor lo corta */
    let m = 99;
    for (const q of G.players) {
      if (q.team === team) continue;
      const near = q.r + br - 3;
      const lag = smLag(p, q) * (p.diff.sure ? 0.45 : 1);   // en el tiro no contar con que el arquero reaccione tarde: tirar solo si entra igual
      for (let k = 2; k <= n; k += 2) { const mk = smReach(q, SM.SPx[k], SM.SPy[k], near) + lag - k; if (mk < m) m = mk; }

  }

  for (let k = 3; k <= n; k += 2) {
    const x = SM.SPx[k], y = SM.SPy[k];
    let tUs = 1e9, tThem = 1e9, who = null;
    for (const q of G.players) {
      const t = smReach(q, x, y, q.r + br - 2) + (q === p ? 6 : 0) + (q.team !== team ? smLag(p, q) : 0);
      if (q.team === team) { if (t < tUs) { tUs = t; who = q; } } else if (t < tThem) tThem = t;
    }

        for (let j = 1; j <= n; j += 2) close = Math.min(close, Math.hypot(SM.SPx[j] - who.x - who.vx * j * 0.5, SM.SPy[j] - who.y - who.vy * j * 0.5));
      }
      return { v: ps * smPos(G, team, x, y) - (1 - ps) * smDanger(G, team, x, y), kind: who === p ? 'space' : 'pass', ps, x, y, who, close };

/* valor de seguir con la pelota (conducir) desde donde está */
function smHold(G, p, x, y, t0) {
  let tThem = 1e9;

  const ps = smSig((tThem - 7) / 3), dir = p.team === 0 ? 1 : -1;

  /* si hay un rival plantado adelante, conducir no lleva a ningún lado: conviene pasarla, tirarla al espacio o rematar */
  let wall = 1;
  for (const q of G.players) {
    if (q.team === p.team) continue;
    const ax = (q.x - x) * dir, ay = Math.abs(q.y - y);

}

/* velocidad de salida para que la pelota vaya en la dirección (dx, dy) sumando el impulso de la patada */
function smSolve(bvx, bvy, dx, dy, ks) {
  const dv = dx * bvx + dy * bvy, disc = dv * dv - (bvx * bvx + bvy * bvy) + ks * ks;
  if (disc < 0) return null;
  const s = dv + Math.sqrt(disc);
  return { s, ux: (s * dx - bvx) / ks, uy: (s * dy - bvy) / ks };
}

function smDecide(G, p) {
  const A = p.ai, D = p.diff, g = G.geo, b = G.ball, W = g.W, H = g.H, gh = g.gh;
  const dir = p.team === 0 ? 1 : -1, ownX = -dir * W, oppX = dir * W, R = p.r + b.r;
  const N = 150;
  const path = smSim(G, b.x, b.y, b.vx, b.vy, N, SM.BPx, SM.BPy, SM.BPvx, SM.BPvy);
  const nb = path.goal >= 0 ? Math.max(1, path.t - 1) : path.n;
  if (path.goal >= 0) for (let i = path.t; i <= N; i++) { SM.BPx[i] = SM.BPx[path.t - 1]; SM.BPy[i] = SM.BPy[path.t - 1]; SM.BPvx[i] = 0; SM.BPvy[i] = 0; }

  const mates = G.players.filter(q => q.team === p.team), opps = G.players.filter(q => q.team !== p.team);
  const tOf = new Map();

  let att = mates[0], best = 1e9;

    for (let k = 1; k <= nb; k++) {

        const vl = Math.hypot(SM.BPvx[k], SM.BPvy[k]) || 1, fx = SM.BPx[k] + SM.BPvx[k] / vl * (R - 2), fy = SM.BPy[k] + SM.BPvy[k] / vl * (R - 2);
        if (smReach(p, fx, fy, 6) <= k) { A.tx = fx; A.ty = fy; A.mode = 'seek'; A.plan = 'block'; return; }
        continue;
      }
      if (smReach(p, SM.BPx[k], SM.BPy[k], R - 4) <= k) { A.tx = SM.BPx[k]; A.ty = SM.BPy[k]; A.mode = 'seek'; return; }
    }
    A.tx = ownX + dir * 18; A.ty = clamp(SM.BPy[nb], -gh + 8, gh - 8); A.mode = 'seek';
  };
  const goalSide = (px, py, dist) => {
    if (D.cover && mates.length === 1 && Math.abs(px - ownX) < 300) {   // solo en 1v1: en equipo el arquero y los marcadores se reparten el arco
      const c = smCover(G, p, px, py, Math.min(tOpp, 60));
      if (c) { A.tx = c.x; A.ty = c.y; A.mode = Math.hypot(c.x - p.x, c.y - p.y) > 45 ? 'seek' : 'arrive'; return; }
    }
    if (D.v2) {
      /* si ya me pasaron (la pelota está más cerca de mi arco que yo) y está cerca del arco: volver a la boca del arco */
      const beaten = (p.x - px) * dir > -8 && Math.abs(px - ownX) < 190;
      if (beaten) {
        A.tx = ownX + dir * 20; A.ty = clamp(py * 0.55, -gh + 12, gh - 12); A.mode = 'seek';
        return;
      }
      /* bisectriz del ángulo pelota-palos: desde ahí el cuerpo tapa el arco entero si está a la distancia justa */
      let a1x = ownX - px, a1y = -gh - py, a2x = ownX - px, a2y = gh - py;
      const l1 = Math.hypot(a1x, a1y) || 1, l2 = Math.hypot(a2x, a2y) || 1;
      a1x /= l1; a1y /= l1; a2x /= l2; a2y /= l2;
      let bx = a1x + a2x, by = a1y + a2y; const bl = Math.hypot(bx, by) || 1; bx /= bl; by /= bl;
      const half = Math.acos(clamp(a1x * a2x + a1y * a2y, -1, 1)) / 2;
      const cover = (p.r + b.r - 3) / Math.tan(Math.max(half, 0.04));
      const toLine = Math.abs((ownX - px) / (bx || 1e-6));

    const others = mates.filter(q => q !== att).sort((a, c) => dir * a.x - dir * c.x);
    const keeper = others[0] === p && (others.length >= 2 || !ours);
    if (shotOnUs && (keeper || others.length === 1)) { block(); return; }
    if (!ours) {
      if (keeper) {
        const tp = Math.min(Math.round(tOpp), nb), px = SM.BPx[tp], py = SM.BPy[tp];
        const far = Math.hypot(px - ownX, py);
        goalSide(px, py, others.length >= 2 ? Math.max(30, far - 34) : clamp(far * 0.55, 30, far - 30));
        return;
      }
      /* el rival tiene la pelota: marcar al rival libre más peligroso, entre él y el arco */
      let mark = null, md = 1e9;
      for (const q of opps) { if (q === oppFirst) continue; const dd = Math.hypot(q.x - ownX, q.y); if (dd < md) { md = dd; mark = q; } }
      if (mark) { const gx = ownX - mark.x, gy = -mark.y, gl = Math.hypot(gx, gy) || 1; A.tx = mark.x + gx / gl * 34; A.ty = mark.y + gy / gl * 34; A.mode = 'arrive'; return; }
      const tp = Math.min(Math.round(tOpp), nb);
      goalSide(SM.BPx[tp], SM.BPy[tp], 90);
      return;
    }
    if (keeper && others.length >= 2) {
      /* en 3v3 uno queda atrás aunque ataquemos, a mitad de camino */
      const px = b.x, py = b.y, far = Math.hypot(px - ownX, py);
      goalSide(px, py, Math.max(60, far * 0.55));
      return;
    }
    /* desmarcarse: buscar un lugar libre y adelantado para recibir */
    let bx = p.x, by = p.y, bv = -1e9;

      st.md++;

    if (r.name === 'Semifinales') {

$('pauseBtn').addEventListener('click', () => { if (state === 'playing') pauseGame(); });
$('kickBtn').addEventListener('contextmenu', e => e.preventDefault());

/* ---------- Dibujo ---------- */
function rr(x, y, w, h2, r) {
  g2.beginPath(); g2.moveTo(x + r, y); g2.arcTo(x + w, y, x + w, y + h2, r); g2.arcTo(x + w, y + h2, x, y + h2, r);
  g2.arcTo(x, y + h2, x, y, r); g2.arcTo(x, y, x + w, y, r); g2.closePath();
}
function kitOf(G, team) { return (G.kits && G.kits[team]) || KIT_DEFAULT[team]; }
function inkOn(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#101412' : '#ffffff';
}

/* ---------- Estadios (modo Libertadores) ----------
   Las tribunas se dibujan una sola vez en un lienzo aparte y después se copian en cada cuadro. */
const STAND = 58;
const STAD_CACHE = { key: '', cv: null, ox: 0, oy: 0 };
const CURVED = { oval: 1, maracana: 1, circle: 1 };
/* medidas del estadio (mitad de ancho y alto, en unidades de la cancha) y forma interior */
function stadiumGeo(G) {
  const st = G.cfg.stadium, g = G.geo;
  if (!st) return null;
  if (st.style === 'circle') {
    const rx = g.W * 1.42, ry = g.H * 1.42;
    return { st, inner: { kind: 'ell', rx, ry }, ox: rx + STAND, oy: ry + STAND * 0.85 };
  }
  if (CURVED[st.style]) {
    const iw = g.boxW + 10, ih = g.boxH + 10, R = 120;
    return { st, inner: { kind: 'rr', w: iw, h: ih, r: R }, ox: iw + STAND, oy: ih + STAND, R };
  }
  const flatBottom = st.style === 'bombonera';
  return { st, inner: { kind: 'rect', w: g.boxW, h: g.boxH }, ox: g.boxW + STAND, oy: g.boxH + STAND, flatBottom };
}
function rrPath(ctx, w, h, r) {
  ctx.moveTo(-w + r, -h); ctx.arcTo(w, -h, w, h, r); ctx.arcTo(w, h, -w, h, r); ctx.arcTo(-w, h, -w, -h, r); ctx.arcTo(-w, -h, w, -h, r); ctx.closePath();
}
function shapePath(ctx, sh, grow) {
  if (sh.kind === 'ell') ctx.ellipse(0, 0, sh.rx + grow, sh.ry + grow * 0.85, 0, 0, TAU);
  else if (sh.kind === 'rr') rrPath(ctx, sh.w + grow, sh.h + grow, sh.r + grow);
  else rrPath(ctx, sh.w + grow, sh.h + grow, grow > 0 ? 10 : 0.01);
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f))));
  return 'rgb(' + c.join(',') + ')';
}
function buildStadium(G, SG, px) {
  const st = SG.st, g = G.geo, cv2 = document.createElement('canvas');
  cv2.width = Math.ceil(SG.ox * 2 * px); cv2.height = Math.ceil(SG.oy * 2 * px);
  const c = cv2.getContext('2d');
  c.setTransform(px, 0, 0, px, SG.ox * px, SG.oy * px);
  const crowd = st.crowd || ['#d9d9d9', '#555555'];
  const pal = [crowd[0], crowd[0], crowd[1], shade(crowd[0], -0.35), shade(crowd[1], -0.3), '#e8e2d6', '#2b2b2b'];
  /* forma de las tribunas: de la forma interior hasta el borde exterior */
  const outer = new Path2D(), stands = new Path2D();
  if (SG.inner.kind === 'rect') {
    const ow = SG.ox, oh = SG.oy;
    if (SG.flatBottom) {
      /* La Bombonera: tres tribunas altas y un lado recto con palcos */
      rrPath(outer, ow, oh, 10);
      rrPath(stands, ow, oh, 10);
    } else { rrPath(outer, ow, oh, 10); rrPath(stands, ow, oh, 10); }
    rrPath(stands, SG.inner.w, SG.inner.h, 0.01);
  } else {
    shapePath(outer, SG.inner, STAND); shapePath(stands, SG.inner, STAND); shapePath(stands, SG.inner, 0);
  }
  c.fillStyle = '#1b2420'; c.fill(outer);
  c.save(); c.clip(stands, 'evenodd');
  /* gente: puntitos de colores (con semilla fija para que no titilen) */
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const stepD = 4.2;
  for (let y = -SG.oy; y < SG.oy; y += stepD) {
    for (let x = -SG.ox; x < SG.ox; x += stepD) {
      const jx = x + rnd() * 1.6, jy = y + rnd() * 1.6;
      let col = pal[Math.floor(rnd() * pal.length)];
      if (st.style === 'bombonera') {
        /* tribunas a franjas azul y oro, como las bandejas de la Bombonera */
        const band = Math.floor((Math.max(Math.abs(jx) - g.boxW, Math.abs(jy) - g.boxH)) / 13);
        col = rnd() < 0.82 ? (band % 2 ? crowd[1] : crowd[0]) : pal[3 + Math.floor(rnd() * 4)];
      }
      c.fillStyle = col; c.fillRect(jx, jy, 2.6, 2.6);

  c.strokeStyle = 'rgba(0,0,0,.22)'; c.lineWidth = 1.2;
  for (let k = 12; k < STAND; k += 12) {
    c.beginPath();
    if (SG.inner.kind === 'rect') rrPath(c, SG.inner.w + k, SG.inner.h + k, 4 + k * 0.1); else shapePath(c, SG.inner, k);
    c.stroke();
  }
  c.restore();
  if (st.style === 'bombonera') {
    /* el lado recto: palcos en una franja angosta y el resto liso */
    const y0 = g.boxH, y1 = SG.oy;
    c.fillStyle = '#e9e4d2'; c.fillRect(-SG.ox + 12, y0, (SG.ox - 12) * 2, y1 - y0);
    c.fillStyle = '#0b3d91'; c.fillRect(-SG.ox + 12, y0 + 4, (SG.ox - 12) * 2, 14);
    c.fillStyle = '#f2c400';
    for (let x = -SG.ox + 20; x < SG.ox - 24; x += 22) c.fillRect(x, y0 + 7, 14, 8);
    c.fillStyle = 'rgba(11,61,145,.85)';
    for (let x = -SG.ox + 18; x < SG.ox - 20; x += 16) c.fillRect(x, y0 + 24, 10, 22);
  }
  if (st.style === 'roof' || st.style === 'maracana') {
    /* techo: una franja clara sobre la parte de atrás de las tribunas */
    c.save();
    const roof = new Path2D();
    if (SG.inner.kind === 'rect') { rrPath(roof, SG.ox, SG.oy, 10); rrPath(roof, SG.inner.w + STAND * 0.45, SG.inner.h + STAND * 0.45, 6); }
    else { shapePath(roof, SG.inner, STAND); shapePath(roof, SG.inner, STAND * 0.5); }
    c.fillStyle = st.style === 'maracana' ? 'rgba(245,245,245,.78)' : 'rgba(225,232,238,.55)'; c.fill(roof, 'evenodd');
    c.restore();
  }
  if (st.style === 'centenario') {
    /* la Torre de los Homenajes, en la tribuna de enfrente */
    const tx = 0, ty = -g.boxH - STAND * 0.55;
    c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(tx - 15, ty - 22, 34, 50);
    c.fillStyle = '#f1efe8'; c.fillRect(tx - 12, ty - 26, 24, 50);
    c.fillStyle = '#c9c3b3'; for (let k = 0; k < 4; k++) c.fillRect(tx - 9, ty - 20 + k * 11, 18, 3);
    c.fillStyle = '#6cb4e4'; c.fillRect(tx - 3, ty - 34, 6, 10);
  }
  if (CURVED[st.style] || st.style === 'circle') {
    /* lo que rodea a la cancha dentro del estadio */
    c.fillStyle = COL.box; const inr = new Path2D(); shapePath(inr, SG.inner, 0); c.fill(inr);
  }
  c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 2; c.stroke(outer);
  return cv2;
}
function drawStadium(G, sc) {
  const SG = stadiumGeo(G);
  if (!SG) return;
  const px = sc * dpr, st = SG.st;
  const key = [st.key, st.n, (st.crowd || []).join(), G.geo.W, G.geo.H, Math.round(px * 100)].join('|');
  if (STAD_CACHE.key !== key) { STAD_CACHE.key = key; STAD_CACHE.cv = buildStadium(G, SG, px); STAD_CACHE.ox = SG.ox; STAD_CACHE.oy = SG.oy; }
  g2.drawImage(STAD_CACHE.cv, -STAD_CACHE.ox, -STAD_CACHE.oy, STAD_CACHE.ox * 2, STAD_CACHE.oy * 2);
}

function drawPitch(G) {
  const geo = G.geo, W = geo.W, H = geo.H, gh = geo.gh, d = geo.d;
  const st = G.cfg.stadium;
  if (!st || !(CURVED[st.style] || st.style === 'circle')) { g2.fillStyle = COL.box; g2.fillRect(-geo.boxW, -geo.boxH, geo.boxW * 2, geo.boxH * 2); }
  g2.fillStyle = COL.pitch; g2.fillRect(-W, -H, W * 2, H * 2);
  if (st && st.style === 'track') {
    /* pista de atletismo alrededor de la cancha (Hernando Siles) */
    g2.save();
    const tr = new Path2D(); rrPath(tr, W + 46, H + 27, 30); rrPath(tr, W + 14, H + 9, 12);
    g2.fillStyle = '#b4573a'; g2.fill(tr, 'evenodd');
    g2.strokeStyle = 'rgba(255,255,255,.4)'; g2.lineWidth = 0.8;
    for (const k of [22, 28, 34, 40]) { g2.beginPath(); rrPath(g2, W + k + 4, H + k * 0.5 + 6, 12 + k * 0.4); g2.stroke(); }
    g2.restore();
    g2.fillStyle = COL.pitch; g2.fillRect(-W, -H, W * 2, H * 2);
  }
  if (st) { g2.fillStyle = 'rgba(255,255,255,.045)'; for (let x = -W; x < W; x += 2 * W / 9) g2.fillRect(x, -H, W / 9, H * 2); }
  for (const s of [-1, 1]) {
    const x0 = s > 0 ? W : -W - d;
    g2.fillStyle = 'rgba(8,14,10,.22)'; g2.fillRect(x0, -gh, d, gh * 2);
    g2.strokeStyle = 'rgba(255,255,255,.10)'; g2.lineWidth = 1; g2.beginPath();
    for (let x = 8; x < d; x += 8) { g2.moveTo(x0 + x, -gh); g2.lineTo(x0 + x, gh); }
    for (let y = -gh + 8; y < gh; y += 8) { g2.moveTo(x0, y); g2.lineTo(x0 + d, y); }
    g2.stroke();
  }
  g2.strokeStyle = COL.line; g2.lineWidth = 3; g2.lineJoin = 'round'; g2.lineCap = 'round';
  g2.beginPath();
  g2.moveTo(-W, -gh); g2.lineTo(-W, -H); g2.lineTo(W, -H); g2.lineTo(W, -gh);
  g2.moveTo(W, gh); g2.lineTo(W, H); g2.lineTo(-W, H); g2.lineTo(-W, gh);
  g2.moveTo(0, -H); g2.lineTo(0, H);
  g2.stroke();
  g2.beginPath(); g2.arc(0, 0, geo.kr, 0, TAU); g2.stroke();
  g2.beginPath(); g2.arc(0, 0, 3, 0, TAU); g2.fillStyle = COL.line; g2.fill();
  for (const s of [-1, 1]) {
    g2.strokeStyle = 'rgba(199,230,189,.75)'; g2.lineWidth = 2;
    g2.beginPath(); g2.moveTo(s * W, -gh); g2.lineTo(s * (W + d), -gh); g2.lineTo(s * (W + d), gh); g2.lineTo(s * W, gh); g2.stroke();
    g2.strokeStyle = kitOf(G, s < 0 ? 0 : 1); g2.lineWidth = 3;
    g2.beginPath(); g2.moveTo(s * W, -gh); g2.lineTo(s * W, gh); g2.stroke();
  }
  for (const post of G.posts) {
    g2.beginPath(); g2.arc(post.x, post.y, post.r, 0, TAU);
    g2.fillStyle = kitOf(G, post.x < 0 ? 0 : 1); g2.fill();
    g2.lineWidth = 2; g2.strokeStyle = COL.ink; g2.stroke();

}

function fmtTime(t) {
  const s = Math.floor(t / 60);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function drawGame(G, alpha, extra) {
  g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  g2.fillStyle = COL.bg; g2.fillRect(0, 0, VW, VH);
  if (!G) return;
  const geo = G.geo, top = 74, bot = G.cfg.stadium ? 30 : 14, side = 10;
  const aw = VW - side * 2, ah = VH - top - bot;
  const SG = stadiumGeo(G), ex = SG ? SG.ox : geo.boxW, ey = SG ? SG.oy : geo.boxH;
  /* como en HaxBall: la cancha no se agranda más que ~1 px por unidad (si no, la pelota parece mucho más rápida) */
  const sc = Math.min(aw / (2 * (ex + 6)), ah / (2 * (ey + 6)), Math.max(1, VW / 1280));
  const ox = VW / 2, oy = top + ah / 2;
  const ix = d => d.px + (d.x - d.px) * alpha, iy = d => d.py + (d.y - d.py) * alpha;

  g2.save(); g2.translate(ox, oy); g2.scale(sc, sc);
  drawStadium(G, sc);
  drawPitch(G);
  const b = G.ball, bx = ix(b), by = iy(b);
  g2.beginPath(); g2.arc(bx, by, b.r, 0, TAU); g2.fillStyle = '#fff'; g2.fill();
  g2.lineWidth = 2; g2.strokeStyle = COL.ink; g2.stroke();
  const labels = [];
  for (const p of G.players) {
    const x = ix(p), y = iy(p), fill = kitOf(G, p.team);
    g2.beginPath(); g2.arc(x, y, p.r, 0, TAU);
    g2.fillStyle = fill; g2.fill();
    const hot = (p.in.kick && p.armed) || p.flash > 0;
    g2.lineWidth = hot ? 3.2 : 2.4; g2.strokeStyle = hot ? '#fff' : COL.ink; g2.stroke();
    const ink = inkOn(fill);
    g2.font = '700 15px ' + FONT; g2.textAlign = 'center'; g2.textBaseline = 'middle';
    g2.lineWidth = 3; g2.strokeStyle = ink === '#ffffff' ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.35)'; g2.strokeText(String(p.idx + 1), x, y + 1);
    g2.fillStyle = ink; g2.fillText(String(p.idx + 1), x, y + 1);
    if (p.me) {
      g2.beginPath(); g2.moveTo(x - 6, y - p.r - 11); g2.lineTo(x + 6, y - p.r - 11); g2.lineTo(x, y - p.r - 3); g2.closePath();
      g2.fillStyle = '#fff'; g2.fill(); g2.lineWidth = 1.5; g2.strokeStyle = COL.ink; g2.stroke();
    }
    labels.push({ x: ox + x * sc, y: oy + (y + p.r) * sc, p });
  }
  g2.restore();

  /* globito cuando pedís la pelota */

    const l = labels.find(x => x.p === G.call.p);
    if (l) {
      const bx = l.x, by = l.y - G.call.p.r * 2 * sc - 22;
      g2.font = '700 13px ' + FONT; const tw = g2.measureText('¡Pasala!').width + 14;
      g2.fillStyle = '#fff'; rr(bx - tw / 2, by - 12, tw, 22, 8); g2.fill();
      g2.beginPath(); g2.moveTo(bx - 5, by + 10); g2.lineTo(bx + 5, by + 10); g2.lineTo(bx, by + 16); g2.closePath(); g2.fill();
      g2.fillStyle = '#101412'; g2.textAlign = 'center'; g2.textBaseline = 'middle'; g2.fillText('¡Pasala!', bx, by);
    }
  }
  g2.font = '600 12px ' + BODY; g2.textAlign = 'center'; g2.textBaseline = 'alphabetic';
  for (const l of labels) {
    g2.lineWidth = 3; g2.strokeStyle = 'rgba(8,12,10,.7)'; g2.strokeText(l.p.name, l.x, l.y + 14);
    g2.fillStyle = l.p.me ? '#fff' : 'rgba(255,255,255,.78)'; g2.fillText(l.p.name, l.x, l.y + 14);
  }
  drawHud(G, extra);
  drawBanner(G);
  if (VH > VW * 1.2) {
    g2.fillStyle = 'rgba(233,240,234,.8)'; g2.font = '600 14px ' + BODY; g2.textAlign = 'center';
    g2.fillText('Girá el dispositivo para jugar en horizontal', VW / 2, VH - 24);
  } else if (!isTouch && G.phase === 'kickoff' && G.tick < 300) {
    g2.fillStyle = 'rgba(233,240,234,.7)'; g2.font = '500 14px ' + BODY; g2.textAlign = 'center';
    g2.fillText('Mover: WASD o flechas   ·   Patear: X o Espacio   ·   ' + (G.nTeam[G.humanTeam] > 1 ? 'Pedir la pelota: E   ·   ' : '') + 'Pausa: P', VW / 2, VH - 18);
  }
}

/* color de un equipo legible sobre el fondo oscuro del marcador */
function hudCol(G, t) {
  const c = kitOf(G, t), n = parseInt(c.slice(1), 16), lum = ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000;
  return lum < 70 ? '#c9d1cc' : c;
}
function drawHud(G, extra) {
  const codes = G.cfg.teamCodes;
  const w = 216, hh = 46, x0 = VW / 2 - w / 2, y0 = 10;
  g2.fillStyle = COL.hud; rr(x0, y0, w, hh, 10); g2.fill();
  g2.textBaseline = 'middle'; g2.textAlign = 'center';
  g2.font = '700 28px ' + FONT;
  g2.fillStyle = hudCol(G, 0); g2.fillText(String(G.score[0]), x0 + 28, y0 + hh / 2 + 1);
  g2.fillStyle = hudCol(G, 1); g2.fillText(String(G.score[1]), x0 + w - 28, y0 + hh / 2 + 1);
  g2.font = '600 20px ' + FONT;
  g2.fillStyle = G.overtime ? '#ffd27a' : '#e9f0ea';
  g2.fillText(G.overtime ? fmtTime(Math.max(0, C.goldenTicks - G.otTicks)) : fmtTime(G.playTicks), VW / 2, y0 + hh / 2 + 1);
  if (codes) {
    g2.font = '700 14px ' + FONT;
    g2.textAlign = 'right'; g2.fillStyle = hudCol(G, 0); g2.fillText(codes[0], x0 - 10, y0 + hh / 2 + 1);
    g2.textAlign = 'left'; g2.fillStyle = hudCol(G, 1); g2.fillText(codes[1], x0 + w + 10, y0 + hh / 2 + 1);
  }
  g2.textAlign = 'center'; g2.textBaseline = 'alphabetic'; g2.font = '500 12px ' + BODY; g2.fillStyle = 'rgba(233,240,234,.62)';
  const sub = G.cfg.subtitle ? G.cfg.subtitle : DIFF[G.cfg.diff] ? DIFF[G.cfg.diff].label + ' · ' + G.cfg.size + 'v' + G.cfg.size : '';
  const lim = G.cfg.timeLimit > 0 ? ' · ' + G.cfg.timeLimit + ':00' : '';
  const goals = G.cfg.scoreLimit > 0 ? ' · a ' + G.cfg.scoreLimit : '';
  const agg = G.cfg.agg ? ' · global ' + (G.score[0] + G.cfg.agg[0]) + '–' + (G.score[1] + G.cfg.agg[1]) : '';
  g2.fillText((G.overtime ? 'Gol de oro · el próximo gol gana' : sub + lim + goals) + agg, VW / 2, y0 + hh + 16);
  if (extra && extra.ping != null) {
    g2.textAlign = 'left'; g2.fillStyle = extra.ping > 150 ? '#ffb4a3' : 'rgba(233,240,234,.62)';
    g2.fillText(extra.ping + ' ms', 14, 28);
  }
}

function drawBanner(G) {
  const bn = G.banner;
  if (!bn || bn.t <= 0) return;
  const a = Math.min(1, bn.t / 20), y = VH / 2 - 10;
  g2.globalAlpha = a; g2.textAlign = 'center'; g2.textBaseline = 'middle';
  const col = bn.team === 0 || bn.team === 1 ? kitOf(G, bn.team) : COL.line;
  g2.font = '700 ' + Math.round(Math.min(72, VW / 9)) + 'px ' + FONT;
  g2.lineWidth = 8; g2.lineJoin = 'round'; g2.strokeStyle = 'rgba(8,12,10,.85)'; g2.strokeText(bn.text, VW / 2, y);
  g2.fillStyle = col; g2.fillText(bn.text, VW / 2, y);
  g2.font = '600 20px ' + BODY; g2.lineWidth = 5;
  g2.strokeText(bn.sub, VW / 2, y + 46); g2.fillStyle = '#fff'; g2.fillText(bn.sub, VW / 2, y + 46);
  g2.globalAlpha = 1; g2.textBaseline = 'alphabetic';

/* ---------- Repetición: se guardan tus teclas en cada tick; con eso se puede volver a jugar el partido exacto ---------- */
let REC = null;
function recStart(cfg) {
  try { REC = { v: 1, cfg: JSON.parse(JSON.stringify(cfg, (k, v) => (k === 'stadium' || k === 'kits' || k === 'roster' ? undefined : v))), inputs: [] }; } catch (e) { REC = null; }
}
function recPush(i) {
  if (!REC) return;
  const q = v => (v > 0.5 ? 2 : v < -0.5 ? 0 : 1);
  REC.inputs.push(String.fromCharCode(97 + q(i.dx) * 3 + q(i.dy) + (i.kick ? 9 : 0)));
}
function downloadReplay() {
  if (!REC || !REC.inputs.length) return;
  const data = JSON.stringify({ v: 1, when: new Date().toISOString(), cfg: REC.cfg, score: game ? game.score : null, inputs: REC.inputs.join('').replace(/(.)\1*/g, (m, c) => c + (m.length > 1 ? m.length : '')), rle: 1 });   // tramos repetidos: "e24h72" = 24 'e' y 72 'h'
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = 'partido-' + (REC.cfg.diff || 'x') + '-' + (game ? game.score.join('a') : '') + '.json';
  document.body.append(a); a.click(); a.remove();
}

/* ---------- Bucle ---------- */
const DT = 1000 / 60;
let onLocalEnd = null;
function frame(now) {
  requestAnimationFrame(frame);
  if (mode === 'pens') { penFrame(now); return; }
  if (state === 'playing' && game && (mode === 'local' || mode === 'wc' || mode === 'lib')) {
    acc += Math.min(now - lastT, 100); lastT = now;
    const human = game.players.find(q => q.human);
    while (acc >= DT && !game.over) {
      if (human) { const i = readInput(); human.in.dx = i.dx; human.in.dy = i.dy; human.in.kick = i.kick; recPush(i); }
      step(game); acc -= DT;
      for (const e of game.events.splice(0)) sound(e);
    }
    drawGame(game, game.over ? 1 : acc / DT);
    if (game.over && onLocalEnd) onLocalEnd();
  } else if (view && (state === 'paused' || state === 'ended')) {
    drawGame(view, 1);
  } else {
    g2.setTransform(dpr, 0, 0, dpr, 0, 0); g2.fillStyle = COL.bg; g2.fillRect(0, 0, VW, VH);
  }
}
function startLoop() { resize(); requestAnimationFrame(t => { lastT = t; frame(t); }); }

/* ---------- Jugar / simular ---------- */
function wcPlay() {
  const p = WC.pending(wc);
  if (!p) return;
  const oppC = p.a === wc.user ? p.b : p.a;
  const kits = WC.kitsFor(wc.user, oppC);
  const diff = WC.diffFor(wc);
  launchGame({
    size: wc.size, diff, humanTeam: 0, timeLimit: wc.minutes, scoreLimit: 0, allowDraw: p.kind === 'group',
    pitch: pitchResolve(wc.pitch, wc.size), teamNames: [WC.BY[wc.user].n, WC.BY[oppC].n], teamCodes: [wc.user, oppC], kits,
    subtitle: p.kind === 'group' ? 'Grupo ' + wc.groups[p.gi].n + ' · fecha ' + (wc.md + 1) : p.label
  }, 'wc', () => wcMatchOver(p, oppC), () => [
    { text: 'Abandonar partido', fn: () => { onLocalEnd = null; setState('idle'); renderHub(); showScreen('wchub'); } }
  ]);
}

function wcMatchOver(p, oppC) {
  onLocalEnd = null;
  const ug = game.score[0], og = game.score[1];
  sound('end');
  if (game.tied) {
    /* empate en eliminación directa: se define por penales */
    setState('ended');
    startPenalties({ names: [WC.BY[wc.user].n, WC.BY[oppC].n], kits: game.kits, diff: WC.diffFor(wc), onDone: pen => wcMatchEnd(p, oppC, ug, og, pen) });
  } else wcMatchEnd(p, oppC, ug, og, null);
}

function wcMatchEnd(p, oppC, ug, og, pen) {
  WC.submitUser(wc, ug, og, pen ? pen.u : null, pen ? pen.c : null);
  saveWc();
  const win = pen ? pen.u > pen.c : ug > og, draw = !pen && ug === og;
  const u = WC.BY[wc.user], o = WC.BY[oppC];
  let meta = p.label + (pen ? ' · penales ' + pen.u + '–' + pen.c : game.overtime ? ' · gol de oro' : '');
  if (wc.out) meta += ' · Quedaste eliminado';
  else if (wc.stage === 'done') meta += ' · ' + wc.exit;
  else if (p.kind === 'group' && wc.stage === 'ko') meta += ' · ¡Clasificaste!';
  const toHub = () => { setState('idle'); hubTab = 'match'; renderHub(); showScreen('wchub'); };
  showEnd({
    title: win ? '¡Ganaste!' : draw ? 'Empate' : 'Perdiste', res: win ? 'win' : draw ? 'draw' : 'lose',
    score: [ug, og], colors: game.kits, names: [u.n, o.n], meta,
    buttons: [{ text: wc.stage === 'done' ? 'Ver el resultado final' : wc.out ? 'Ver el torneo' : 'Continuar', go: true, fn: toHub }]
  });
}

function wcSim() {
  const p = WC.pending(wc);
  if (!p) return;
  WC.simUser(wc);
  saveWc();
  renderHub();
}

const LIB_GROUPS = [
  { key: 'diff', label: 'Dificultad de los rivales', opts: [['easy', 'Fácil'], ['normal', 'Normal'], ['hard', 'Difícil'], ['expert', 'Experto'], ['impossible', 'Imposible'], ['prog', 'Progresiva']],
    hints: {

      expert: 'Reflejos casi perfectos en todos los partidos.', impossible: 'Rivales imposibles: hay que jugar perfecto.',
      prog: 'Empieza fácil en la fase de grupos y llega a Experto en semifinales y la final.'
    } },

  { key: 'size', label: 'Jugadores por equipo', opts: [['1', '1 vs 1'], ['2', '2 vs 2'], ['3', '3 vs 3']] },
  { key: 'field', label: 'Tamaño de cancha', opts: [['auto', 'Futsal Bazinga'], ['big', 'Grande'], ['huge', 'Enorme'], ['stadium', 'Clásica']],
    hints: {
      auto: 'Las medidas de los mapas de futsal de Bazinga (más grande en 2v2 y 3v3), con las proporciones de cada estadio.',
      big: 'Futsal un 20% más grande.', huge: 'Futsal un 40% más grande.',
      stadium: 'La medida clásica de HaxBall de cada estadio (más chica).'
    } }
];
/* medida de la cancha para un partido: la del estadio, agrandada según la opción */
function libPitch(base, size) {
  /* futsal de Bazinga según la cantidad de jugadores, con las proporciones del estadio (la Bombonera es más chica) */
  const fut = PITCHES.futsal.bySize[size] || PITCHES.futsal, prop = base.W / 370;
  const k = LIBCFG.field === 'big' ? 1.2 : LIBCFG.field === 'huge' ? 1.4 : 1;
  const src = LIBCFG.field === 'stadium' ? base : { W: fut.W * prop * k, H: fut.H * (base.H / 170) * k, gh: fut.gh * Math.sqrt(k), kr: fut.kr };
  const W = clampN(Math.round(src.W), PITCH_LIMITS.W[0], PITCH_LIMITS.W[1]);
  const H = clampN(Math.round(src.H), PITCH_LIMITS.H[0], PITCH_LIMITS.H[1]);
  const gh = clampN(Math.round(src.gh), PITCH_LIMITS.gh[0], Math.min(PITCH_LIMITS.gh[1], H - 25));
  return { W, H, gh, kr: src.kr };
}

  const k = LIB.kitsFor(p.h, p.a), kits = p.home ? k : [k[1], k[0]];

  const size = lib.size, roster = [];
  roster.push({ team: 0, human: true, name: 'Vos' });
  for (let i = 0; i < size - 1; i++) roster.push({ team: 0, human: false, name: LIB.BY[me].p[i] });
  for (let i = 0; i < size; i++) roster.push({ team: 1, human: false, name: LIB.BY[opp].p[i] });
  launchGame({
    size, diff: LIB.diffFor(lib), humanTeam: 0, timeLimit: lib.minutes, scoreLimit: 0, allowDraw: !p.decisive, agg,
    pitch: libPitch(p.stadium.pitch, size), stadium: p.stadium, roster,

    { text: 'Abandonar partido', fn: () => { onLocalEnd = null; setState('idle'); renderLibHub(); showScreen('libhub'); } }
  ]);

function libMatchOver(p, opp) {
  onLocalEnd = null;
  const ug = game.score[0], og = game.score[1];
  sound('end');

    setState('ended');
    startPenalties({ names: [libName(lib.user), libName(opp)], kits: game.kits, diff: LIB.diffFor(lib), onDone: pen => libMatchEnd(p, opp, ug, og, pen) });
  } else libMatchEnd(p, opp, ug, og, null);
}

function libMatchEnd(p, opp, ug, og, pen) {
  const agg = game.cfg.agg;
  LIB.submitUser(lib, ug, og, pen ? [pen.u, pen.c] : null);
  saveLib();
  const tu = ug + (agg ? agg[0] : 0), to = og + (agg ? agg[1] : 0);
  const decided = p.decisive;
  const win = pen ? pen.u > pen.c : (decided ? tu > to : ug > og), draw = !pen && (decided ? tu === to : ug === og);
  let meta = p.label;
  if (agg) meta += ' · global ' + tu + '–' + to;
  if (pen) meta += ' · penales ' + pen.u + '–' + pen.c; else if (game.overtime) meta += ' · gol de oro';
  if (lib.stage === 'done') meta += ' · ' + lib.exit;
  else if (lib.out) meta += ' · Quedaste eliminado';
  else if (p.kind === 'group' && lib.stage === 'ko') meta += ' · ¡Clasificaste a octavos!';
  else if (decided && win) meta += ' · ¡Pasaste de ronda!';
  const toHub = () => { setState('idle'); libTab = 'match'; renderLibHub(); showScreen('libhub'); };
  showEnd({
    title: win ? (decided ? '¡Ganaste la llave!' : '¡Ganaste!') : draw ? 'Empate' : (decided ? 'Quedaste afuera' : 'Perdiste'),
    res: win ? 'win' : draw ? 'draw' : 'lose',
    score: [ug, og], colors: game.kits, names: [libName(lib.user), libName(opp)], meta,
    buttons: [{ text: lib.stage === 'done' ? 'Ver el resultado final' : lib.out ? 'Ver la copa' : 'Continuar', go: true, fn: toHub }]
  });
}
